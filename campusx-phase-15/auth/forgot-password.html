<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | CampusX</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/login.css"><link rel="stylesheet" href="../assets/css/ui-system.css"></head>
<body class="login-page"><main class="login-form-card" style="max-width:520px;margin:6vh auto"><a class="text-link" href="../login.html">← Back to Login</a><header class="login-heading"><span class="eyebrow">Password Recovery</span><h1>Forgot Password</h1><p>Enter your registered email. Supabase will send a recovery link if the account exists.</p></header><div id="forgot-status" class="login-status" hidden></div><form id="forgot-form" class="login-form"><div class="form-field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><button class="btn btn-primary" type="submit">Send Recovery Email</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase/supabase-client.js"></script><script src="../assets/js/supabase/auth.js"></script><script>document.getElementById('forgot-form').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('forgot-status');s.hidden=false;s.textContent='Sending recovery request...';const r=await CampusXSupabaseAuth.resetPassword(new FormData(e.target).get('email'));s.className='login-status '+(r.ok?'success':'error');s.textContent=r.message;});</script></body>
</html>
