<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | CampusX</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/login.css"><link rel="stylesheet" href="../assets/css/ui-system.css"></head>
<body class="login-page"><main class="login-form-card" style="max-width:520px;margin:6vh auto"><a class="text-link" href="../login.html">← Back to Login</a><header class="login-heading"><span class="eyebrow">Supabase Recovery</span><h1>Set New Password</h1><p>After opening the Supabase recovery link, enter your new password.</p></header><div id="reset-status" class="login-status" hidden></div><form id="reset-form" class="login-form"><div class="form-field"><label>New Password</label><input name="password" type="password" autocomplete="new-password" minlength="10" required></div><div class="form-field"><label>Confirm Password</label><input name="confirm" type="password" autocomplete="new-password" minlength="10" required></div><button class="btn btn-primary" type="submit">Update Password</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase/supabase-client.js"></script><script src="../assets/js/supabase/auth.js"></script><script>document.getElementById('reset-form').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const s=document.getElementById('reset-status');s.hidden=false;if(fd.get('password')!==fd.get('confirm')){s.className='login-status error';s.textContent='Passwords do not match.';return;}const r=await CampusXSupabaseAuth.updatePassword(fd.get('password'));s.className='login-status '+(r.ok?'success':'error');s.textContent=r.message;if(r.ok)setTimeout(()=>location.href='../login.html',1200);});</script></body>
</html>
